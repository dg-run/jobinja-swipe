name: Refresh jobs

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-jobs
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Refresh public jobs snapshot
        env:
          PAGES: 5
          LIMIT: 72
          CONCURRENCY: 2
        run: npm run refresh:jobs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/jobs.json
          if git diff --cached --quiet; then
            echo "No job changes."
          else
            git commit -m "chore: refresh jobinja jobs"
            git push
          fi
